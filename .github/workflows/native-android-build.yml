name: LOREVERSE Native Android Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android-build.yml'
  push:
    branches: [feature/native-android-rebuild]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build native debug APK
        working-directory: native-android
        run: gradle assembleDebug
      - name: Run unit tests
        working-directory: native-android
        run: gradle testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: loreverse-native-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
